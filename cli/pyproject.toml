[project]
name = "evidentia-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "EslamKamel89", email = "eslam_kamel_89@hotmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
evidentia = "evidentia_cli.main:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyright>=1.1.414", "pytest>=9.2.0", "ruff>=0.17.6"]
